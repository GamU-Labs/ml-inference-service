services:
    ml-inference:
        build: .
        ports:
            - '5001:5001'
        env_file:
            - .env
        volumes:
            - ./models:/app/models
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/v1/health')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s